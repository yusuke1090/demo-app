name: Build apps

# main に入るたびに確認して、Android の APK と iPhone などで使う Web 版を作る。
# Web 版は GitHub Pages（https://yusuke1090.github.io/demo-app/）にも公開する
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FARM_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/farm-monitor.p12"

      - name: Build the APK
        env:
          FARM_KEYSTORE_PASSWORD: ${{ secrets.FARM_KEYSTORE_PASSWORD }}
        run: |
          export FARM_KEYSTORE_PATH="$RUNNER_TEMP/farm-monitor.p12"
          # 番号が増えないと、スマホで更新として扱われない
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk demo-app.apk

      - name: Build the web version
        run: |
          # CanvasKit を同梱して、ネットにつながらない場所でも画面を出せるようにする
          flutter build web --release --no-web-resources-cdn
          (cd build/web && zip -qr ../../demo-app-web.zip .)
          # Pages では /demo-app/ の下に置くので、基準の場所を書き換えた写しを作る
          cp -r build/web build/pages
          sed -i 's#<base href="/">#<base href="/demo-app/">#' build/pages/index.html
          grep -q '<base href="/demo-app/">' build/pages/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新の APK" \
              --notes "main の最新の状態から作った APK です。"
          gh release upload latest demo-app.apk demo-app-web.zip --clobber

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
